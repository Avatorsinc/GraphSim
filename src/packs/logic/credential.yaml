id: logic.credential
name: Credential / Auth Method
vendor: builtin
category: logic
description: "An authentication method (PIN, password, biometric, NFC badge, etc.)"
evaluator: passthrough
interfaces:
  - { name: in, type: virtual }
  - { name: out, type: virtual }
defaultConfig:
  method: ""
  note: ""
configSchema:
  type: object
  title: Credential
  properties:
    method:
      type: string
      title: Auth Method
      enum: ["PIN Code", "Password", "Biometric (Fingerprint)", "Biometric (Face)", "NFC Badge", "Smart Card", "OTP / TOTP", "Push Notification", "Certificate", "SSO Token"]
    note:
      type: string
      title: Note
